# Self-hosted GPU stack for harvest_post.
#
# Layout:
#   vllm-chat  — Qwen3.5-9B-AWQ on :8000 (LLM classification + quality scoring)
#   vllm-embed — Qwen3-Embedding-0.6B on :8001 (vector embeddings)
#   harvest-post — Python batch job
#
# VRAM budget: Qwen3.5-9B-AWQ needs ~14.4GB (weights + workspace) so it
# gets the GPU exclusively at 0.95 utilization. The embedding model (0.6B)
# runs on CPU — tiny enough that CPU inference is fast for our batch sizes.
#
# HuggingFace cache is mounted from host so models persist across restarts.

services:
  vllm-chat:
    image: vllm/vllm-openai:latest
    container_name: gpu-vllm-chat
    runtime: nvidia
    ipc: host
    command: >
      --model QuantTrio/Qwen3.5-9B-AWQ
      --served-model-name qwen3.5:9b
      --max-model-len 32768
      --gpu-memory-utilization 0.95
      --quantization awq_marlin
      --enforce-eager
      --chat-template /app/chat_template_nothink.jinja
      --port 8000
      --host 0.0.0.0
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ./chat_template_nothink.jinja:/app/chat_template_nothink.jinja:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    restart: unless-stopped
    networks:
      - gpu-network

  vllm-embed:
    image: vllm/vllm-openai:latest
    container_name: gpu-vllm-embed
    # NO runtime: nvidia — runs on CPU only. 0.6B embedding model is
    # small enough that CPU inference is fast (<1s per embedding call).
    # This frees the entire GPU for the 9B chat model.
    command: >
      --model Qwen/Qwen3-Embedding-0.6B
      --served-model-name qwen3-embedding:0.6b
      --runner pooling
      --device cpu
      --port 8001
      --host 0.0.0.0
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    networks:
      - gpu-network

  harvest-post:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: harvest-post:local
    container_name: gpu-harvest-post
    env_file:
      - .env
    environment:
      - VLLM_BASE_URL=http://vllm-chat:8000/v1
      - VLLM_EMBED_BASE_URL=http://vllm-embed:8001/v1
    depends_on:
      vllm-chat:
        condition: service_healthy
      vllm-embed:
        condition: service_healthy
    networks:
      - gpu-network
    restart: "no"

networks:
  gpu-network:
    driver: bridge
