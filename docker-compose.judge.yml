# Sequential judge stack for harvest_post.
#
# Used by run.sh AFTER the Qwen-based harvest batch completes and the gpu.yml
# stack is torn down. Loads a different model (HyperCLOVA X SEED Think 14B)
# to re-judge rejected articles as an independent LLM-as-judge. Must NOT run
# concurrently with docker-compose.gpu.yml — both use port 8000 and together
# would exceed the 16GB VRAM budget.
#
# Model choice trail (see git history):
#   1. HyperCLOVAX-SEED-Think-14B — Naver only released ≤3B open
#   2-3. LGAI-EXAONE/EXAONE-Deep-7.8B-AWQ + EXAONE-3.5-7.8B-Instruct-AWQ —
#        custom config needs transformers>=4.58, vllm-openai has 4.57
#   4. Qwen/Qwen2.5-14B-Instruct-AWQ — worked but quality calibration weak:
#      first 200-row run dumped all 48 auto_recovered into category=etc and
#      the sample showed marketing/anniversary posts being promoted.
#   5. → Qwen/Qwen3-14B-AWQ [current]
#      - Qwen3 generation (2025) — strongest reasoning in this size class,
#        official Qwen AWQ
#      - Different generation than Qwen3.5-9B primary scorer (different
#        training corpus and instruction-tuning recipe — not strictly
#        independent but meaningful asymmetry)
#      - 14B AWQ ≈ 7-8GB weights, fits 16GB with headroom
#      - Better at Korean than Qwen2.5 family, supports built-in <think> mode
#   Pair this with the heavily rewritten judge prompt (Q1/Q2/Q3 forced
#   reasoning, explicit etc rubric distinguishing engineer-valuable
#   non-tech vs promotional) and the tightened auto_recover gate that
#   includes a category sanity check (see judge.py + audit_rejected.py).
# max-model-len 8192: article body capped at 6000 chars upstream (~4k
# tokens), leaves headroom for prompt + Q1/Q2/Q3 reasoning + JSON output.

services:
  vllm-judge:
    image: vllm/vllm-openai:latest
    container_name: gpu-vllm-judge
    runtime: nvidia
    ipc: host
    command: >
      --model ${JUDGE_MODEL:-Qwen/Qwen3-14B-AWQ}
      --served-model-name qwen3-judge
      --max-model-len 8192
      --gpu-memory-utilization 0.9
      --quantization ${JUDGE_QUANT:-awq_marlin}
      --enforce-eager
      --port 8000
      --host 0.0.0.0
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      # 14B load is slower than Qwen 9B; 180s start period covers a cold cache
      # miss on first run (subsequent boots hit the mounted HF cache).
      start_period: 180s
    restart: "no"
    networks:
      - judge-network

networks:
  judge-network:
    driver: bridge
