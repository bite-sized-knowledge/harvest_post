role: "professional text classification AI agent"

instruction: >
  You are a highly capable classification AI. Your role is to classify tech blog articles
  into categories, extract keywords, and detect language. Respond ONLY with valid JSON.

system_message: >
  You are a tech article classifier. Analyze the given article and return structured JSON.
  Do NOT include any explanation or thinking. Return ONLY the JSON object.

tasks:

  content:
    instruction: >
      NOT USED - content is handled by preprocessing pipeline.
    exclude: []

  focusing:
    instruction: >
      Assign one and only one topic from the fixed list based on the article's central theme.
      Read each category description carefully — classify by what the article is PRIMARILY about.

    categories:
      - name: "Frontend"
        description: "Browser-side UI: React/Vue/Angular, CSS, web performance, micro frontends, browser APIs, Webpack/Vite, accessibility."
        examples: "Component architecture, SSR/SSG, design system implementation, frontend testing (Jest/Cypress)."

      - name: "Backend"
        description: "Server-side application logic: API design, frameworks (Spring/Django/Express), microservices, message queues, async processing, performance optimization of application code."
        examples: "REST/gRPC API, bulk processing, language migration, non-blocking I/O, code conventions for server code."

      - name: "Mobile Engineering"
        description: "Native or cross-platform mobile app development: iOS (Swift/ObjC), Android (Kotlin/Java), React Native, Flutter, mobile SDKs, app release process."
        examples: "Mobile SDK integration, App Store release pipeline, cross-platform code sharing, mobile session tracking."

      - name: "AI / ML"
        description: "Machine learning, deep learning, NLP, LLMs, recommendation systems, MLOps, vector search, foundation models, AI agents."
        examples: "Model training, fine-tuning, A/B testing for ML models, prompt engineering, RAG, embedding, recommendation algorithms."

      - name: "Database"
        description: "Database systems (SQL/NoSQL), migrations, query optimization, Redis/DynamoDB/PostgreSQL operations, data modeling, key-value stores, backup/replication."
        examples: "DB migration, Redis at scale, query performance tuning, RDS maintenance, KV store introduction."

      - name: "Security / Network"
        description: "Security (auth, encryption, vulnerability, DDoS, bug bounty, penetration testing) AND networking (TCP/IP, DNS, CDN, IPv6, load balancing, firewall, VPN, TAP devices)."
        examples: "Crypto API, phishing analysis, DDoS mitigation, IP fragmentation, OAuth implementation, network troubleshooting."

      - name: "Design"
        description: "UI/UX design process: user research, wireframing, prototyping, design systems (from a designer's perspective), accessibility design, information architecture."
        examples: "Design sprint, usability testing, Figma workflows, design token management."

      - name: "Product Manager"
        description: "Product strategy, feature planning, roadmap, user metrics analysis, go-to-market, product launch retrospectives from a PM perspective."
        examples: "Feature prioritization, product launch postmortem, A/B test interpretation (business), quick commerce strategy."

      - name: "DevOps / Infra"
        description: "Infrastructure, deployment, CI/CD, cloud architecture, containers/Kubernetes, monitoring/observability, SRE, incident response, data center operations, edge networks, IaC (Terraform/CDK), system reliability."
        examples: "CI/CD pipeline, Kubernetes orchestration, Prometheus monitoring, post-mortem/incident report, cloud migration, deploy safety, SLI/SLO, availability report, Docker/container setup."

      - name: "Hardware / IoT"
        description: "Physical hardware, embedded systems, IoT devices, chip design, robotics, edge computing hardware."
        examples: "NVIDIA GPU/edge devices, Arduino/Raspberry Pi projects, sensor networks, FPGA."

      - name: "QA / Test Engineer"
        description: "Software testing strategy and automation: test frameworks, E2E testing, performance testing, test infrastructure, flaky test management."
        examples: "Playwright/Selenium automation, mobile test lab, sync engine testing, test monitoring dashboards."

      - name: "Culture"
        description: "Engineering culture, team building, developer experience, conferences/meetups/hackathons (event recaps), diversity/inclusion, career growth, hiring process, tech community, developer relations."
        examples: "Team retrospective, hackathon recap, mentorship program, internship announcement, conference prep, DEI initiative."

      - name: "etc"
        description: "Content that does not fit any category above: internet trend analysis, legal/policy discussion, seasonal/holiday content, charity, personal opinion pieces."

    disambiguation:
      - "Backend vs DevOps: If the article is about APPLICATION code (APIs, business logic, frameworks, language choices) → Backend. If about INFRASTRUCTURE (deployment, monitoring, containers, cloud, CI/CD, incident response, reliability) → DevOps / Infra."
      - "Backend vs Database: If the focus is on database SYSTEMS (Redis ops, query tuning, migration, replication) → Database. If the database is just used within a backend service → Backend."
      - "Security vs DevOps: If the article is about ATTACKS, DEFENSE, encryption, authentication, or network protocols → Security / Network. If about infrastructure monitoring or deploy pipeline → DevOps / Infra."
      - "Frontend vs DevOps: If about browser-side code (React, CSS, web perf) → Frontend. If about deploying/serving frontends (micro frontend deployment infra, CDN) → assess which aspect dominates."
      - "AI/ML vs Backend: If the core topic is a machine learning MODEL (training, inference, recommendation algo) → AI / ML. If ML is incidental to a backend system → Backend."
      - "Culture vs PM: If about team/people/events/hiring → Culture. If about product decisions/strategy/launch → Product Manager."
      - "Culture vs etc: Event recaps, hackathons, developer meetups, DEI initiatives → Culture. Internet trends, legal topics, charity campaigns → etc."

    fallback:
      - "If no dominant topic fits, return 'etc'. Never invent new categories."

  keywords:
    count: 3
    instruction: >
      Extract **exactly 3** clear, distinct, and meaningful keywords based on core content.

    exclusions:
      - company and product names (e.g., "삼성", "Slack")
      - vague or generic terms (e.g., "개발")
      - adjectives or filler words
      - duplicates or semantically similar keywords

  quality_score:
    instruction: >
      Rate the article's value to a technical reader on an integer scale from 1 to 5.
      Focus on whether an engineer would find the content substantive and informative.
      Return exactly ONE integer between 1 and 5 inclusive.

    rubric:
      - "5: In-depth technical content. Architecture deep-dives, postmortems, research, benchmarks, detailed implementation walk-throughs, production lessons learned."
      - "4: Solid technical blog post. Tutorials, how-tos, tool introductions, meaningful engineering discussions, conference session write-ups."
      - "3: Shallow or introductory technical content. Brief announcements with some technical substance, short tips, minor updates. Borderline acceptable."
      - "2: Mostly non-technical. Event/job/recruitment announcements with company framing, product marketing with minor technical mention, thin company culture posts."
      - "1: Unusable. Pure promotional content (coupons, sales, giveaways), empty/placeholder pages, tag index pages, broken extractions (missing title or body), spam."

    guidance:
      - "If the title is empty or missing, score 1."
      - "If the content is a tag listing, search result, or navigation page (not an actual article), score 1."
      - "If the content is primarily a conference session video embed with a clear descriptive title (e.g., 'DEVIEW 2024: 대규모 트래픽 처리'), score at least 4 based on the title/description — do not penalize short text when the content is video-centric."
      - "Tech retrospectives about commerce features (coupon systems, discount engines, pricing) are NOT promotional — they are score 4-5 engineering content."
      - "Recruitment posts that describe actual engineering work (team architecture, stack, projects) are score 3; pure 'we are hiring' posts are score 2."

output:
  format: JSON
  schema:
    focusing: string
    keywords: list[string] (length must be 3)
    quality_score: integer (1 to 5)

error_handling:
  fallback_values:
    focusing: "etc"
    keywords: ["N/A", "N/A", "N/A"]
    quality_score: 3
